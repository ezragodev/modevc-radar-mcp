<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mode VC Radar</title>
  <style>
    body { width: 380px; margin: 0; padding: 14px; background: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; }
    .hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; padding-bottom: 10px; margin-bottom: 12px; }
    .hdr b { letter-spacing: 0.08em; font-size: 14px; }
    .badge { background: #10b981; color: #052e16; font-weight: 700; padding: 2px 7px; border-radius: 99px; font-size: 11px; }
    .row { display: flex; gap: 6px; margin-bottom: 10px; }
    input, select { flex: 1; background: #18181b; border: 1px solid #27272a; color: #f4f4f5; padding: 7px 9px; border-radius: 6px; font-size: 12px; }
    button { background: #10b981; color: #052e16; border: none; font-weight: 600; padding: 7px 11px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .card { background: #121215; border: 1px solid #27272a; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .card a { color: #10b981; text-decoration: none; font-weight: 600; }
    .muted { color: #a1a1aa; font-size: 11px; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #27272a; }
    .links a { color: #a1a1aa; text-decoration: none; font-size: 11px; }
    .links a:hover { color: #f4f4f5; }
  </style>
</head>
<body>
  <div class="hdr">
    <b>MODE VC RADAR</b>
    <span class="badge">$1M-$5M Checks</span>
  </div>
  <div class="row">
    <select id="stage">
      <option value="seed">Seed</option>
      <option value="pre-seed">Pre-Seed</option>
      <option value="series-a">Series A</option>
    </select>
    <input id="q" placeholder="Sector or firm (e.g. ai, consumer)...">
    <button id="go">Match</button>
  </div>
  <div id="results">Loading Mode VC Investor Atlas...</div>
  <div class="links">
    <a href="https://modevc.com/investors/" target="_blank">3,651 VCs</a>
    <a href="https://modevc.com/charts/" target="_blank">Daily AI Charts</a>
    <a href="https://modevc.com/tools/shopify-fundraising-calculator" target="_blank">Shopify Calculator</a>
    <a href="https://modevc.com/contact" target="_blank">Pitch Mode VC</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
